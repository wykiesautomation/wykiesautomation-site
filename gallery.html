<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <meta name="description" content="Product UI previews and gallery."/>

  https://fonts.gstatic.com
  <link href="https://fonts.googleapis.com/css2?family=Inter0;600;800&display=swap
  assets/img/favicon-32.png
  <link rel="manifest" href="manifest.webe-color" content="#2F76FF"/>

  <!-- IMPORTANT: this gives you the background/theme -->
  assets/css/style.css
</head>

<body>
<header class="nav">
  <div class="container navwrap">
    <div class="brand">
      assets/img/logo.png
      <strong>Wykies Automation</strong>
    </div>

    <nav class="links">
      index.htmlHome</a>
      products.htmlProducts</a>
      docs.htmlDocuments</a>
      trial.htmlTrial</a>
      gallery.htmlGallery</a>

      trial.htmlDownload Trial</a>
      docs.htmlView Docs</a>
      https://wa.me/27716816131WhatsApp</a>
      <a class="btn outline" href="admin>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 style="margin:0">Gallery</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
        <!-- Back button (history) -->
        <button id="btnBack" class="btn outline" type="button">← Back</button>

        <!-- Back to home -->
        <a class="btn primary" href="index/div>
    </div>

    <p class="muted" style="margin:10px 0 0">
      UI previews for WA‑01 to WA‑11.
    </p>

    <div id="galleryGrid" class="gallery-grid" style="margin-top:14px"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" style="display:none">
  <button class="lightbox-close" id="lbClose" type="button" aria-label="Close">✕</button>
  <img id="lbImg" alt="Preview"/>
</div>

<script>
(function () {
  const grid = document.getElementById('galleryGrid');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');

  // Back button
  const btnBack = document.getElementById('btnBack');
  btnBack.addEventListener('click', () => {
    // If there is history, go back; otherwise go home.
    if (history.length > 1) history.back();
    else location.href = 'index.html';
  });

  const pad2 = n => (n < 10 ? '0' : '') + n;

  // Prefer gallery, fallback to product (so deleting /assets/gallery later won't break)
  function candidatesFor(skuLower) {
    return [
      `assets/gallery/${skuLower}.PNG`,
      `assets/gallery/${skuLower}.png`,
      `assets/gallery/${skuLower}-01.PNG`,
      `assets/gallery/${skuLower}-01.png`,
      `assets/product/${skuLower}.PNG`,
      `assets/product/${skuLower}.png`
    ];
  }

  function setImgWithFallback(img, list) {
    let i = 0;
    img.onerror = () => {
      i++;
      if (i < list.length) img.src = list[i];
      else img.style.opacity = '0.25';
    };
    img.src = list[0];
  }

  function makeTile(n) {
    const skuLower = 'wa-' + pad2(n);
    const label = 'WA-' + pad2(n);
    const cand = candidatesFor(skuLower);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'gallery-card';
    card.title = label;

    const img = document.createElement('img');
    img.className = 'gallery-thumb';
    img.alt = label;
    img.loading = 'lazy';
    setImgWithFallback(img, cand);

    const cap = document.createElement('div');
    cap.className = 'gallery-cap';
    cap.innerHTML = `<strong>${label}</strong>`;

    card.appendChild(img);
    card.appendChild(cap);

    card.addEventListener('click', () => {
      lbImg.src = img.src;
      lb.style.display = 'flex';
    });

    return card;
  }

  for (let i = 1; i <= 11; i++) grid.appendChild(makeTile(i));

  lbClose.addEventListener('click', () => lb.style.display = 'none');
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.style.display = 'none'; });
})();
</script>
</body>
</html>
