<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 style="margin:0">Gallery</h2>
      <span class="muted">UI previews</span>
    </div>

    <div id="galleryGrid" class="gallery-grid" style="margin-top:14px"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" style="display:none">
  <button class="lightbox-close" id="lbClose" type="button" aria-label="Close">✕</button>
  <img id="lbImg" alt="Preview" />
</div>

<script>
(function () {
  const grid = document.getElementById('galleryGrid');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');

  const pad2 = n => (n < 10 ? '0' : '') + n;

  // Prefer gallery, fallback to product (so you can delete /assets/gallery later)
  function candidatesFor(skuLower) {
    return [
      `assets/gallery/${skuLower}.PNG`,
      `assets/gallery/${skuLower}.png`,
      `assets/gallery/${skuLower}-01.PNG`,
      `assets/gallery/${skuLower}-01.png`,
      `assets/product/${skuLower}.PNG`,
      `assets/product/${skuLower}.png`
    ];
  }

  function setImgWithFallback(img, list) {
    let i = 0;
    img.onerror = () => {
      i++;
      if (i < list.length) img.src = list[i];
      else img.style.opacity = '0.25';
    };
    img.src = list[0];
  }

  function makeTile(n) {
    const skuLower = 'wa-' + pad2(n);
    const label = 'WA-' + pad2(n);
    const cand = candidatesFor(skuLower);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'gallery-card';
    card.title = label;

    const img = document.createElement('img');
    img.className = 'gallery-thumb';
    img.alt = label;
    img.loading = 'lazy';
    setImgWithFallback(img, cand);

    const cap = document.createElement('div');
    cap.className = 'gallery-cap';
    cap.innerHTML = `<strong>${label}</strong>`;

    card.appendChild(img);
    card.appendChild(cap);

    card.addEventListener('click', () => {
      lbImg.src = img.src;
      lb.style.display = 'flex';
    });

    return card;
  }

  for (let i = 1; i <= 11; i++) grid.appendChild(makeTile(i));

  lbClose.addEventListener('click', () => lb.style.display = 'none');
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.style.display = 'none'; });
})();
</script>
``
