<script>
(function(){
  const CONFIG = {
    // Use the same Apps Script URL your Admin uses:
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwO16jzeQVcsNt4zOj-YQ8LndsMgaTk089QZkgkb0YrxVf8IbxQi9fnK_1mL9q83d8_LA/exec'
  };

  const grid = document.getElementById('galleryGrid');
  const lb   = document.getElementById('lightbox');
  const lbImg= document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');

  // Render one card
  function makeCard(url, label){
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'gallery-card';
    card.title = label || '';

    const img = document.createElement('img');
    img.className = 'gallery-thumb';
    img.alt = label || 'Preview';
    img.loading = 'lazy';
    img.src = url;

    const cap = document.createElement('div');
    cap.className = 'gallery-cap';
    cap.innerHTML = `<strong>${label || ''}</strong>`;

    card.appendChild(img);
    card.appendChild(cap);
    card.addEventListener('click', () => { lbImg.src = img.src; lb.style.display = 'flex'; });

    return card;
  }

  async function loadGallery(){
    grid.innerHTML = '<div class="small" style="color:#cbd5e1">Loading…</div>';
    try {
      const r = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=gallery`, { cache: 'no-store' });
      const arr = await r.json(); // expected: [{url, name, createdTime}] from Admin backend
      grid.innerHTML = '';

      if (!Array.isArray(arr) || arr.length === 0) {
        grid.innerHTML = '<div class="small" style="color:#fca5a5">No images found.</div>';
        return;
      }

      for (const item of arr) {
        const url = item.url || item.webViewLink || item.webContentLink || item.imageUrl;
        const label = (item.name || '').replace(/\.[a-z0-9]+$/i,''); // filename without extension
        if (url) grid.appendChild(makeCard(url, label));
      }
    } catch (e) {
      grid.innerHTML = '<div class="small" style="color:#fca5a5">Failed to load gallery.</div>';
    }
  }

  // Lightbox close handlers
  lbClose.addEventListener('click', () => lb.style.display = 'none');
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.style.display = 'none'; });

  // Go!
  loadGallery();
})();
</script>
