<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapMap — Upload Activation Request</title>
  <style>
    body{font-family:Arial, sans-serif; max-width:720px; margin:40px auto; padding:0 16px;}
    .card{border:1px solid #e5e7eb; border-radius:12px; padding:20px;}
    input,button{width:100%; padding:12px; margin:8px 0; font-size:16px;}
    button{cursor:pointer}
    .muted{color:#6b7280; font-size:14px}
    .ok{color:#166534; font-weight:700}
    .err{color:#991b1b; font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload Activation Request</h2>
    <p class="muted">Select your <b>activation_request.json</b> generated by the SnapMap Request Tool.</p>

    <label>Email (for license delivery)</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label>WhatsApp number (E.164 without +, e.g. 27716816131)</label>
    <input type="text" id="cell" placeholder="27716816131" />

    <label>activation_request.json</label>
    <input type="file" id="file" accept=".json" />

    <button id="btn">Continue to Payment</button>
    <p id="msg" class="muted"></p>

    <p class="muted">
      <b>Note:</b> For security, do not upload directly to GitHub from the browser. Route uploads through an API relay that writes to GitHub.
    </p>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const cell  = document.getElementById('cell').value.trim();
      const file  = document.getElementById('file').files[0];

      if (!file) {
        msg.className = 'err';
        msg.textContent = 'Please select activation_request.json';
        return;
      }

      // TODO: POST the file to your upload relay that stores it into the repo and returns request_id.
      const requestId = crypto.randomUUID();

      msg.className = 'ok';
      msg.textContent = 'Redirecting to payment…';

      const qs = new URLSearchParams({ request_id: requestId, email, cell }).toString();
      window.location.href = './checkout.html?' + qs;
    });
  </script>
</body>
</html>
