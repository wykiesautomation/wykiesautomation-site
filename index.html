<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Wykies Automation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <meta name="google-signin-client_id" content="291364861368-vskn09o73106qa9rqrt4bhbhif87vdim.apps.googleusercontent.com" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--brand:#2F76FF;--bg:#0b1220;--bg2:#0f172a;--bg3:#111827;--txt:#e5e7eb;--muted:#94a3b8;--border:#1f2937;--good:#10b981;--warn:#f59e0b;--bad:#ef4444}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
    .container{max-width:1120px;margin:0 auto;padding:0 16px}
    header.admin-header{background:var(--bg2);border-bottom:1px solid var(--border)}
    .header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
    h1{margin:0;font-size:24px} .auth-controls{display:flex;gap:10px;align-items:center} .role-badge{background:rgba(47,118,255,.12);color:var(--txt);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-weight:600}
    .btn{appearance:none;border:1px solid var(--border);background:var(--bg3);color:var(--txt);padding:6px 10px;border-radius:8px;cursor:pointer}
    .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn-ghost{background:transparent} .btn-xs{padding:4px 8px;font-size:12px}
    .admin-nav{background:var(--bg2);border-bottom:1px solid var(--border)} .tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0} .tabs a{display:inline-block;color:var(--txt);text-decoration:none;background:var(--bg3);border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer} .tabs a.active{background:var(--brand);border-color:var(--brand);color:#fff}
    main.container{padding:16px 0 40px} .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px} .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px} .card-title{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em} .card-value{font-size:24px;font-weight:700}
    .tab{display:none} .tab.active{display:block} .table-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden} table.table{width:100%;border-collapse:separate;border-spacing:0} .table thead th{background:var(--bg3);color:#cbd5e1;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px} .table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
    /* AUTH GATE */
    #auth-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(2,6,23,.8),rgba(2,6,23,.9));z-index:50} .auth-card{width:min(420px,92%);background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.35)} .auth-logo{height:44px;margin:2px auto 12px;display:block}
    .gsi-wrap{display:flex;justify-content:center;margin:4px 0 10px} .btn-block{display:block;width:100%;padding:10px 14px;border-radius:12px;font-weight:600}
    .passphrase-wrap{margin-top:8px} .passphrase-row{display:flex;gap:8px;margin-top:8px} .passphrase-row input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--txt)} .allowlist{margin-top:10px;color:var(--muted);font-size:13px}
    .hidden{display:none}
  </style>
</head>
<body class="admin">
  <!-- AUTH GATE OVERLAY (same look) -->
  <div id="auth-gate">
    <div class="auth-card">
      <img src="/assets/img/logo.png" class="auth-logo" alt="Wykies Automation" onerror="this.style.display='none'">
      <div id="gsi-host" class="gsi-wrap"></div>
      <button id="btn-passphrase" class="btn btn-block">Use passphrase</button>
      <div id="passphrase-panel" class="passphrase-wrap hidden">
        <div class="passphrase-row">
          <input id="passphrase" type="password" placeholder="Enter admin passphrase">
          <button id="btn-unlock" class="btn btn-primary">Unlock</button>
        </div>
        <div id="passphrase-msg" class="muted" style="min-height:18px;margin-top:6px"></div>
      </div>
      <div class="allowlist">Allowlist: <strong>wykiesautomation@gmail.com</strong></div>
    </div>
  </div>

  <header class="admin-header">
    <div class="container header-row">
      <h1>Admin</h1>
      <div class="auth-controls">
        <button id="btn-signin" class="btn">Sign in</button>
        <button id="btn-signout" class="btn hidden">Sign out</button>
        <div id="role-badge" class="role-badge">Viewer</div>
      </div>
    </div>
  </header>

  <div class="admin-nav">
    <div class="container tabs" id="tabs">
      <a data-tab="dashboard" class="active">Dashboard</a>
      <a data-tab="catalog">Catalog</a>
      <a data-tab="prices">Price Log</a>
      <a data-tab="payments">Payments</a>
      <a data-tab="pages">Pages</a>
      <a data-tab="settings">Settings</a>
      <a data-tab="audit">Audit</a>
      <a data-tab="gallery">Gallery</a>
      <a data-tab="announcements">Announcements</a>
      <a data-tab="documents">Documents</a>
    </div>
  </div>

  <main class="container admin-main">
    <section id="tab-dashboard" class="tab active">
      <div class="cards">
        <div class="card"><div class="card-title">Today’s Sales</div><div id="card-sales" class="card-value">R 0</div></div>
        <div class="card"><div class="card-title">Verified ITNs (24h)</div><div id="card-itn" class="card-value">0</div></div>
        <div class="card"><div class="card-title">Queue Health</div><div id="card-health" class="card-value ok">OK</div></div>
      </div>
    </section>
  </main>

  <script>
  (function(){
    // Elevation helper (works for both passphrase and redirect)
    function elevate(){
      document.getElementById('role-badge').textContent='Admin';
      document.getElementById('btn-signin').classList.add('hidden');
      document.getElementById('btn-signout').classList.remove('hidden');
      document.getElementById('auth-gate').classList.add('hidden');
      try{ localStorage.setItem('wykiesAdmin','1'); }catch(_){ }
    }

    // Auto-elevate if we came back from Apps Script login bridge
    try { if(localStorage.getItem('wykiesAdmin')==='1') elevate(); } catch(_){ }

    // Google Identity — REDIRECT mode (no popup/postMessage)
    function initGIS(){
      if(!window.google||!google.accounts||!google.accounts.id) return;
      google.accounts.id.initialize({
        client_id: document.querySelector('meta[name="google-signin-client_id"]').content,
        ux_mode: 'redirect',
        login_uri: 'https://script.google.com/macros/s/AKfycbwO16jzeQVcsNt4zOj-YQ8LndsMgaTk089QZkgkb0YrxVf8IbxQi9fnK_1mL9q83d8_LA/exec?op=login&back=' + encodeURIComponent('https://wykiesautomation.co.za/admin/')
      });
      const host = document.getElementById('gsi-host');
      google.accounts.id.renderButton(host, { theme:'filled_white', size:'large', shape:'pill', width: 320, text: 'signin_with' });
      document.getElementById('btn-signin').addEventListener('click', ()=> host.querySelector('div[role="button"]').click());
    }
    window.addEventListener('load', initGIS);

    // Passphrase fallback
    const PASS_URL = 'https://script.google.com/macros/s/AKfycbwO16jzeQVcsNt4zOj-YQ8LndsMgaTk089QZkgkb0YrxVf8IbxQi9fnK_1mL9q83d8_LA/exec?op=authPassphrase';
    document.getElementById('btn-passphrase').addEventListener('click', ()=>{
      document.getElementById('passphrase-panel').classList.toggle('hidden');
      document.getElementById('passphrase').focus();
    });
    document.getElementById('btn-unlock').addEventListener('click', async ()=>{
      const input = document.getElementById('passphrase');
      const msg = document.getElementById('passphrase-msg');
      const val = String(input.value||'');
      if(!val){ msg.textContent = 'Enter passphrase'; return; }
      msg.textContent = 'Verifying…';
      try{
        const r = await fetch(PASS_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ passphrase: val }) });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const json = await r.json();
        if(json && json.ok){ elevate(); msg.textContent=''; input.value=''; }
        else { msg.textContent = json && json.error ? json.error : 'Invalid passphrase'; }
      }catch(err){ msg.textContent = 'Failed: ' + err.message; }
    });

    document.getElementById('btn-signout').addEventListener('click', ()=>{
      try{ localStorage.removeItem('wykiesAdmin'); }catch(_){ }
      document.getElementById('role-badge').textContent='Viewer';
      document.getElementById('btn-signout').classList.add('hidden');
      document.getElementById('btn-signin').classList.remove('hidden');
      document.getElementById('auth-gate').classList.remove('hidden');
    });
  })();
  </script>
</body>
</html>
