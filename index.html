<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wykies Admin — Security</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0B1220; --card:#0F172A; --ink:#E5E7EB; --muted:#9CA3AF; --brand:#2F76FF; --ok:#16a34a; --warn:#ef4444; }
    html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:760px;margin:36px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid #1F2937;border-radius:10px;padding:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .muted{color:var(--muted)}
    .btn{cursor:pointer;background:var(--brand);border:0;color:#fff;border-radius:8px;padding:10px 14px;font-weight:600}
    .btn.outline{background:transparent;border:1px solid var(--brand);color:var(--brand)}
    .btn.danger{background:var(--warn);border-color:var(--warn)}
    .input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #203146;background:#0b1328;color:#fff}
    .badge{display:inline-block;padding:4px 8px;border-radius:6px;font-weight:600}
    .ok{background:#052; color:#bdf}
    .not{background:#220; color:#fdc}
    .head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
    .right{display:flex;gap:8px;align-items:center}
    .small{font-size:12px}
    .hide{display:none}
    .kbd{background:#06152e;border:1px solid #193255;padding:2px 6px;border-radius:6px;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
  </style>
  <script src="https://accounts.google.com/gsi/client"ad>
<body>
<div class="wrap">
  <h2 style="margin:0 0 4px">Wykies Admin — Security</h2>
  <div class="muted small">Google Sign‑In + PayFast Passphrase</div>

  <!-- Sign-in card -->
  <div id="cardSignIn" class="card" style="margin-top:14px">
    <div class="head">
      <strong>Sign in</strong>
      <span class="small muted">Allowed: <span class="kbd">ADMIN_ALLOWLIST</span></span>
    </div>
    <div id="gbtn"></div>
    <div id="signinMsg" class="small muted" style="margin-top:10px"></div>
  </div>

  <!-- Secrets card -->
  <div id="cardSecrets" class="card hide" style="margin-top:14px">
    <div class="head">
      <strong>PayFast Passphrase</strong>
      <div class="right small">
        <div id="ppState" class="badge not">Passphrase: not set</div>
      </div>
    </div>

    <label class="small">Set / Update Passphrase</label>
    <input id="ppInput" class="input" type="password" placeholder="Enter exact passphrase as in PayFast Dashboard" />

    <div class="row" style="margin-top:12px">
      <button id="btnSave" class="btn">Save Passphrase</button>
      <button id="btnClear" class="btn outline danger">Clear Passphrase</button>
    </div>

    <div id="secretsMsg" class="small muted" style="margin-top:10px"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // === CONFIG ===
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwO16jzeQVcsNt4zOj-YQ8LndsMgaTk089QZkgkb0YrxVf8IbxQi9fnK_1mL9q83d8_LA/exec';
  var GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // <-- replace with your OAuth Web client ID

  // === STATE ===
  var token = null;  // server-side admin token from verifyGoogleId
  var email = null;

  // === DOM ===
  var cardSignIn = document.getElementById('cardSignIn');
  var cardSecrets = document.getElementById('cardSecrets');
  var signinMsg = document.getElementById('signinMsg');
  var ppInput = document.getElementById('ppInput');
  var btnSave = document.getElementById('btnSave');
  var btnClear = document.getElementById('btnClear');
  var secretsMsg = document.getElementById('secretsMsg');
  var ppState = document.getElementById('ppState');

  // === Google Identity init ===
  window.onload = function () {
    if (!window.google || !google.accounts || !google.accounts.id) {
      signinMsg.textContent = 'Google Sign-In failed to load.';
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onGoogleCredential,
      auto_select: false
    });
    google.accounts.id.renderButton(
      document.getElementById('gbtn'),
      { theme: 'outline', size: 'large', width: 280 }
    );
  };

  // Handle Google ID token -> verifyGoogleId -> server admin token
  function onGoogleCredential(resp) {
    var idToken = resp.credential;
    if (!idToken) { signinMsg.textContent = 'No credential returned.'; return; }

    var body = new URLSearchParams();
    body.append('action', 'verifyGoogleId');
    body.append('idToken', idToken);

    fetch(GAS_URL, { method:'POST', body })
      .then(function(r){ return r.ok ? r.text() : 'ERR:Network'; })
      .then(function(txt){
        if (!/^OK:/i.test(txt)) throw new Error(txt.replace(/^ERR:/i,'').trim());
        var parts = txt.split(':'); // OK:email:token
        email = parts[1]; token = parts[2];
        localStorage.setItem('wyk_admin_token', token);
        localStorage.setItem('wyk_admin_email', email);
        cardSignIn.classList.add('hide');
        cardSecrets.classList.remove('hide');
        secretsMsg.textContent = 'Signed in as ' + email;
        refreshSecretsState();
      })
      .catch(function(err){
        signinMsg.textContent = 'Sign-in failed: ' + (err && err.message ? err.message : String(err));
      });
  }

  function refreshSecretsState() {
    var body = new URLSearchParams();
    body.append('action','getSecretsStatus');
    body.append('token', token);

    fetch(GAS_URL, { method:'POST', body })
      .then(function(r){ return r.ok ? r.json() : { ok:false }; })
      .then(function(j){
        if (!j || j.ok === false) { ppState.className='badge not'; ppState.textContent='Passphrase: not set'; return; }
        ppState.className = j.hasPassphrase ? 'badge ok' : 'badge not';
        ppState.textContent = 'Passphrase: ' + (j.hasPassphrase ? 'set' : 'not set');
        if (j.sandbox) secretsMsg.textContent = 'Sandbox: ON'; else secretsMsg.textContent = '';
      })
      .catch(function(){
        ppState.className='badge not';
        ppState.textContent='Passphrase: unknown';
      });
  }

  btnSave.addEventListener('click', function(){
    var pass = (ppInput.value || '').trim();
    if (!pass) { secretsMsg.textContent = 'Enter a passphrase first.'; return; }

    var body = new URLSearchParams();
    body.append('action','setPassphrase');
    body.append('token', token);
    body.append('passphrase', pass);

    fetch(GAS_URL, { method:'POST', body })
      .then(function(r){ return r.ok ? r.text() : 'ERR'; })
      .then(function(t){
        if (!/^OK/i.test(t)) throw new Error(String(t));
        ppInput.value = '';
        secretsMsg.textContent = 'Passphrase saved.';
        refreshSecretsState();
      })
      .catch(function(err){
        secretsMsg.textContent = 'Save failed: ' + (err && err.message ? err.message : String(err));
      });
  });

  btnClear.addEventListener('click', function(){
    if (!confirm('Clear passphrase?')) return;

    var body = new URLSearchParams();
    body.append('action','clearPassphrase');
    body.append('token', token);

    fetch(GAS_URL, { method:'POST', body })
      .then(function(r){ return r.ok ? r.text() : 'ERR'; })
      .then(function(t){
        if (!/^OK/i.test(t)) throw new Error(String(t));
        secretsMsg.textContent = 'Passphrase cleared.';
        refreshSecretsState();
      })
      .catch(function(err){
        secretsMsg.textContent = 'Clear failed: ' + (err && err.message ? err.message : String(err));
      });
  });

})();
</script>
</body>
</html>
