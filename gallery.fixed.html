<!-- Gallery (fixed styles + layout + lightbox) -->
<style>
  /* --- Global white text overrides (for this page) --- */
  .section .muted, .section a, .section h2 { color: #ffffff !important; }
  .section a:hover { color: #e5e7eb !important; text-decoration: underline; }

  /* --- Gallery layout --- */
  .gallery-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .gallery-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .gallery-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; }
  @media (max-width: 980px){ .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 680px){ .gallery-grid { grid-template-columns: 1fr; } }

  .gallery-card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:10px; overflow:hidden; cursor:pointer; padding:0; text-align:left; }
  .gallery-thumb { width:100%; height:220px; object-fit:cover; display:block; }
  .gallery-cap { font-size:12px; color:#cbd5e1; padding:8px 10px 10px; }

  /* Lightbox */
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:1000; }
  .lightbox img { max-width:90vw; max-height:90vh; border-radius:6px; border:1px solid rgba(255,255,255,0.15); box-shadow:0 10px 30px rgba(0,0,0,0.6); }
  .lightbox-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  .lightbox-close:hover { background:rgba(255,255,255,0.15); }
</style>

<section class="section">
  <div class="container">
    <div class="section-head gallery-head">
      <div>
        <h2 style="margin:0">Gallery</h2>
        <span class="muted">UI previews for WA-01 to WA-11</span>
      </div>
      <div class="gallery-actions">
        <a class="btn outline" href="index.html">← Back</a>
        <a class="btn outline" href="docs.html">View Docs</a>
        <a class="btn whatsapp" href="https://wa.me/27716816131" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lbClose" type="button" aria-label="Close">✕</button>
  <img id="lbImg" alt="Preview" />
</div>

<script>
(function(){
  const grid = document.getElementById('galleryGrid');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');
  const pad2 = n => (n < 10 ? '0' : '') + n;

  // Prefer /assets/gallery, fallback to /assets/product (PNG/JPG/WEBP)
  function candidatesFor(skuLower){
    return [
      `assets/gallery/${skuLower}.webp`,
      `assets/gallery/${skuLower}.jpg`,
      `assets/gallery/${skuLower}.png`,
      `assets/gallery/${skuLower}-01.webp`,
      `assets/gallery/${skuLower}-01.jpg`,
      `assets/gallery/${skuLower}-01.png`,
      `assets/product/${skuLower}.webp`,
      `assets/product/${skuLower}.jpg`,
      `assets/product/${skuLower}.png`
    ];
  }
  function setImgWithFallback(img, list){
    let i = 0;
    img.onerror = () => { i++; if(i < list.length) img.src = list[i]; else img.style.opacity = '0.25'; };
    img.src = list[0];
  }
  function makeTile(n){
    const skuLower = 'wa-' + pad2(n);
    const label = 'WA-' + pad2(n);
    const cand = candidatesFor(skuLower);
    const card = document.createElement('button'); card.type = 'button'; card.className = 'gallery-card'; card.title = label;
    const img = document.createElement('img'); img.className = 'gallery-thumb'; img.alt = label; img.loading = 'lazy'; setImgWithFallback(img, cand);
    const cap = document.createElement('div'); cap.className = 'gallery-cap'; cap.innerHTML = `<strong>${label}</strong>`;
    card.appendChild(img); card.appendChild(cap);
    card.addEventListener('click', () => { lbImg.src = img.src; lb.style.display = 'flex'; });
    return card;
  }
  for (let i = 1; i <= 11; i++) grid.appendChild(makeTile(i));
  lbClose.addEventListener('click', () => lb.style.display = 'none');
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.style.display = 'none'; });
})();
</script>
