<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Wykies Admin</title><link rel='stylesheet' href='assets/css/admin.css'></head><body><div class='shell'><div class='top'><div style='display:flex;align-items:center;gap:10px'><img src='../assets/images/logo-blue.png' style='height:32px'><strong>Wykies Admin</strong></div><div class='row'><span id='role' class='badge'>Viewer</span><button id='btnSignIn' class='btn'>Sign in with Google</button><input id='passphrase' class='input' placeholder='Admin passphrase' style='width:220px'><button id='btnPass' class='btn'>Use Passphrase</button></div></div><div class='tabs'><div class='tab active' data-tab='dashboard'>Dashboard</div><div class='tab' data-tab='products'>Products</div><div class='tab' data-tab='gallery'>Gallery</div><div class='tab' data-tab='payments'>Payments</div><div class='tab' data-tab='logs'>Logs</div><div class='tab' data-tab='settings'>Settings</div></div><div id='view-dashboard' class='panel'><h2>Dashboard</h2><div class='row'><div class='panel'><div>Products</div><div id='kpiProducts' style='font-size:28px;font-weight:800'>0</div></div><div class='panel'><div>Payments Today</div><div id='kpiPayments' style='font-size:28px;font-weight:800'>0</div></div><div class='panel'><div>Announcements</div><div id='kpiAnnouncements' style='font-size:28px;font-weight:800'>0</div></div></div></div><div id='view-products' class='panel' style='display:none'><div class='row' style='justify-content:space-between'><h2>Products</h2><div class='row'><button id='btnAdd' class='btn'>Add</button><button id='btnSave' class='btn primary'>Save Changes</button></div></div><table class='table' id='tblProducts'><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Summary</th><th>Image URL</th><th>Trial URL</th><th>Doc URL</th><th>Active</th></tr></thead><tbody></tbody></table></div><div id='view-gallery' class='panel' style='display:none'><h2>Gallery</h2><input id='galleryUrl' class='input' placeholder='Image URL'><input id='galleryCaption' class='input' placeholder='Caption (<=120 chars)'><button id='btnGalleryAdd' class='btn'>Add</button><div id='galleryList' class='row' style='margin-top:12px'></div></div><div id='view-payments' class='panel' style='display:none'><h2>Payments</h2><input id='paySearch' class='input' placeholder='Search payments'><div id='paymentsWrap' style='overflow:auto;max-height:420px;margin-top:10px'></div></div><div id='view-logs' class='panel' style='display:none'><h2>Logs</h2><div id='logsWrap' style='white-space:pre;overflow:auto;max-height:420px'></div></div><div id='view-settings' class='panel' style='display:none'><h2>Settings</h2><div class='row'><div class='panel'><h3>Public Fields</h3><label>Registered Address</label><input id='companyAddress' class='input'><label>VAT Number</label><input id='companyVAT' class='input'><button id='btnSaveCompany' class='btn'>Save</button></div><div class='panel'><h3>Integration</h3><label>Apps Script URL</label><input id='apiUrl' class='input' placeholder='https://script.google.com/macros/s/.../exec'><label>Google OAuth Client ID</label><input id='googleClientId' class='input'><button id='btnSaveConfig' class='btn'>Save</button></div></div></div></div><script src='assets/js/admin.js'></script></body></html>
