
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Wykies Automation</title>
  <meta name="robots" content="noindex,nofollow" />

  ../logo.png
  ./assets/css/admin.css

  <!-- ✅ Load our admin JS FIRST so WA_onGoogle exists -->
  ./assets/js/admin.js?v=20260114</script>

  <!-- ✅ Then load Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" deferbody>
  <header class="topbar">
    <div class="left">
      ../logo.png
      <div>
        <div class="title">Wykies Automation</div>
        <div class="subtitle">Admin Dashboard</div>
      </div>
    </div>
    <div class="right">
      <span id="userPill" class="pill">Signed out</span>
      ../index.htmlPublic site</a>
    </div>
  </header>

  <main class="container">
    <section class="card pad">
      <h1>Sign in</h1>
      <p class="muted">Admin access is restricted to <b>wykiesautomation@gmail.com</b>.</p>

      <!-- ✅ data-callback must match window.WA_onGoogle in admin.js -->
      <div id="g_id_onload"
        data-client_id="YOUR_CLIENT_ID.apps.googleusercontent.com"
        data-callback="WA_onGoogle"
        data-auto_select="false"
        data-itp_support="true">
      </div>

      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="filled_black"
        data-text="signin_with"
        data-shape="pill"
        data-logo_alignment="left">
      </div>

      <div id="authMsg" class="muted" style="margin-top:10px"></div>
      <div class="note">Admin actions are enforced server-side by Apps Script (allowlist: wykiesautomation@gmail.com).</div>
    </section>

    <section class="tabs">
      <button class="tab active" data-tab="products">Products</button>
      <button class="tab" data-tab="payments">Payments</button>
      <button class="tab" data-tab="settings">Settings</button>
      <button class="tab" data-tab="logs">Logs</button>
    </section>

    <section id="tab-products" class="card pad panel">
      <div class="panelhead">
        <h2>Products</h2>
        <div class="actions">
          <button id="btnRefreshProducts" class="btn" type="button">Refresh</button>
        </div>
      </div>
      <div class="tablewrap"><table id="productsTable"></table></div>
    </section>

    <section id="tab-payments" class="card pad panel" style="display:none">
      <div class="panelhead">
        <h2>Payments</h2>
        <div class="actions">
          <button id="btnRefreshPayments" class="btn" type="button">Refresh</button>
        </div>
      </div>
      <pre class="logbox" id="paymentsBox">(loaded from Apps Script)</pre>
    </section>

    <section id="tab-settings" class="card pad panel" style="display:none">
      <div class="panelhead">
        <h2>Settings</h2>
        <div class="actions">
          <button id="btnRefreshSettings" class="btn" type="button">Refresh</button>
        </div>
      </div>
      <pre class="logbox" id="settingsBox">(loaded from Apps Script)</pre>
    </section>

    <section id="tab-logs" class="card pad panel" style="display:none">
      <div class="panelhead">
        <h2>Logs</h2>
        <div class="actions">
          <button id="btnRefreshLogs" class="btn" type="button">Refresh</button>
        </div>
      </div>
      <pre class="logbox" id="logsBox">(loaded from Apps Script)</pre>
    </section>
  </main>
</body>
</html>
